/* NxSure Workbench. One quiet light theme with a matching dark one; NxSure violet only for focus and small accents.
   Layout: top bar, then each case as a split screen: details on the left, documents and checks on the right, decisions in a fixed footer. */
:root{
  --f:"NxPortal",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --bg:#F3F4F7; --surface:#FFFFFF; --sub:#F7F8FA; --hover:#F1F2F6; --line:#E3E5EB; --line2:#CDD1D9;
  --ink:#161823; --ink2:#454A58; --ink3:#6E7383; --faint:#9BA0AE;
  --brand:#4B32D6; --brand-ink:#3A26B0; --brand-soft:#EEEBFC; --brand-line:#D6CFF7;
  --pri:#17151F; --pri-ink:#FFFFFF; --pri-h:#4B32D6;
  --ok:#1E7A55; --ok-soft:#E4F2EA; --ok-line:#BFE0CD;
  --warn:#8F540A; --warn-soft:#FAF0DD; --warn-line:#EED5A6;
  --bad:#B4232F; --bad-soft:#FBE9EA; --bad-line:#F1C3C7;
  --info:#1F5FA8; --info-soft:#E7EFF9; --info-line:#C5D7EE;
  --side:#15132A; --side-ink:#D9D6E8; --side-mute:#8E89A9;
  --paper-sh:0 1px 2px rgba(20,22,35,.08),0 8px 24px -12px rgba(20,22,35,.28);
  --sh:0 18px 50px -20px rgba(20,22,35,.4),0 6px 16px -8px rgba(20,22,35,.16);
  --r:8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1015; --surface:#17181F; --sub:#1C1D25; --hover:#22232C; --line:#2A2C36; --line2:#3A3D49;
    --ink:#ECEDF2; --ink2:#C2C5D0; --ink3:#9295A3; --faint:#6C6F7C;
    --brand:#A493FF; --brand-ink:#C2B6FF; --brand-soft:#252041; --brand-line:#3F3670;
    --pri:#ECEDF2; --pri-ink:#121318; --pri-h:#C2B6FF;
    --ok:#5CC995; --ok-soft:#14281F; --ok-line:#24503A;
    --warn:#E6B460; --warn-soft:#2B2213; --warn-line:#5A4520;
    --bad:#F07A83; --bad-soft:#2E1619; --bad-line:#5E2A30;
    --info:#79AEEC; --info-soft:#14233A; --info-line:#26436A;
    --paper-sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.7);
    --sh:0 20px 60px -20px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1015; --surface:#17181F; --sub:#1C1D25; --hover:#22232C; --line:#2A2C36; --line2:#3A3D49;
  --ink:#ECEDF2; --ink2:#C2C5D0; --ink3:#9295A3; --faint:#6C6F7C;
  --brand:#A493FF; --brand-ink:#C2B6FF; --brand-soft:#252041; --brand-line:#3F3670;
  --pri:#ECEDF2; --pri-ink:#121318; --pri-h:#C2B6FF;
  --ok:#5CC995; --ok-soft:#14281F; --ok-line:#24503A;
  --warn:#E6B460; --warn-soft:#2B2213; --warn-line:#5A4520;
  --bad:#F07A83; --bad-soft:#2E1619; --bad-line:#5E2A30;
  --info:#79AEEC; --info-soft:#14233A; --info-line:#26436A;
  --paper-sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.7);
  --sh:0 20px 60px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 13.5px/1.45 var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand-ink)}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.mut{color:var(--ink3)}
.sm{font-size:12px}
.b{font-weight:650}
.num{text-align:right;white-space:nowrap}
.nowrap{white-space:nowrap}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- app shell ---------- */
#app{height:100%;display:grid;grid-template-rows:48px 1fr}
.top{display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap}
.brand svg{width:24px;height:24px}
.brand .wm b{color:var(--brand)}
.brand .tag{font-weight:500;color:var(--ink3);font-size:13px;padding-left:8px;border-left:1px solid var(--line)}
.nav{display:flex;gap:2px;margin-left:6px}
.nv{border:0;background:none;padding:6px 10px;border-radius:6px;color:var(--ink2);font-weight:550;display:flex;align-items:center;gap:6px;white-space:nowrap}
.nv:hover{background:var(--hover)}
.nv.on{background:var(--brand-soft);color:var(--brand-ink)}
.nv .cnt{font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 6px;color:var(--ink2)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.avail{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 8px;font-weight:600;font-size:12.5px;white-space:nowrap}
.avail .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.avail.off .dot{background:var(--faint);box-shadow:0 0 0 3px var(--hover)}
.qchip{font-size:12px;color:var(--ink3);white-space:nowrap}
.qchip b{color:var(--ink);font-weight:650}
.qchip .risk{color:var(--bad);font-weight:650}
.ib{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink2)}
.ib:hover{background:var(--hover)}
.ib svg{width:16px;height:16px}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;background:var(--surface);white-space:nowrap}
.me:hover{background:var(--hover)}
.av{width:26px;height:26px;border-radius:50%;background:var(--hover);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink2);flex:none}
.me .nm{font-weight:600;font-size:12.5px;line-height:1.1}
.me .rl{font-size:11px;color:var(--ink3);line-height:1.1}
.menu{position:absolute;right:12px;top:46px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh);padding:6px;min-width:220px;z-index:40}
.menu button{display:flex;width:100%;border:0;background:none;padding:8px 10px;border-radius:6px;text-align:left;gap:8px;align-items:center}
.menu button:hover{background:var(--hover)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
main{min-height:0;position:relative;overflow:hidden}

/* ---------- buttons, chips ---------- */
.btn{height:32px;padding:0 12px;border-radius:7px;border:1px solid var(--line2);background:var(--surface);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.pri:hover{background:var(--pri-h);border-color:var(--pri-h)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.dng{color:var(--bad);border-color:var(--bad-line)}
.btn.dng:hover{background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--hover)}
.btn.xs{height:26px;padding:0 9px;font-size:12px;border-radius:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.pri[disabled]:hover{background:var(--pri);border-color:var(--pri)}
.lnk{border:0;background:none;padding:0;color:var(--brand-ink);font-weight:600;font-size:12px}
.lnk:hover{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--sub);color:var(--ink2);border:1px solid var(--line);white-space:nowrap;line-height:18px}
.chip svg{width:12px;height:12px}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.chip.info{background:var(--info-soft);color:var(--info);border-color:var(--info-line)}
.chip.brand{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--brand-line)}
.chip.plain{background:none}
.ico{display:inline-grid;place-items:center;flex:none}
.ico svg{width:16px;height:16px}
.st-ok{color:var(--ok)} .st-warn{color:var(--warn)} .st-bad{color:var(--bad)} .st-info{color:var(--info)} .st-todo{color:var(--faint)}

/* ---------- case layout ---------- */
.case{display:grid;grid-template-rows:auto 1fr auto;height:100%;min-height:0}
.case-h{display:flex;gap:16px;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.case-h .t{min-width:0}
.case-h h1{font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.case-h .meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:4px;font-size:12px;color:var(--ink3);align-items:center}
.case-h .meta b{color:var(--ink2);font-weight:600}
.case-h .r{display:flex;align-items:center;gap:10px;flex:none}
.tat{min-width:180px}
.tat .l{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.tat .l b{font-weight:650}
.tat .bar{height:4px;background:var(--hover);border-radius:4px;margin-top:5px;overflow:hidden}
.tat .bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.tat.warn .bar i{background:var(--warn)} .tat.warn .l b{color:var(--warn)}
.tat.bad .bar i{background:var(--bad)} .tat.bad .l b{color:var(--bad)}
.tat .s{font-size:11px;color:var(--ink3);margin-top:3px}
.asg{font-size:11.5px;color:var(--ink3);text-align:right;line-height:1.3}
.asg b{color:var(--ink2);font-weight:600}
.case-b{display:grid;grid-template-columns:minmax(440px,46fr) minmax(0,54fr);min-height:0}
.case-b.full .left{display:none}
.case-b.full{grid-template-columns:1fr}
.pane{min-height:0;overflow:auto}
.left{padding:14px 16px 24px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:14px}
.right{display:grid;grid-template-rows:minmax(0,60fr) minmax(0,40fr);overflow:hidden;background:var(--surface)}
.case-f{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line)}
.case-f .hint{font-size:12.5px;color:var(--ink3);display:flex;align-items:center;gap:7px;min-width:0}
.case-f .hint b{color:var(--ink)}
.case-f .hint svg,.ro svg,.meta svg{width:16px;height:16px;flex:none}
.case-f .acts{display:flex;gap:8px;flex:none}
.ro{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--info-soft);color:var(--info);font-size:12.5px;border-bottom:1px solid var(--info-line)}
.ro b{font-weight:650}

/* section blocks in the left pane */
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:650}
.sec-h .x{font-size:12px;color:var(--ink3)}
.box{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.box.pad{padding:10px 12px}
.insight{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 12px;border-radius:10px;background:var(--brand-soft);border:1px solid var(--brand-line)}
.insight .ico{width:26px;height:26px;border-radius:7px;background:var(--surface);color:var(--brand);border:1px solid var(--brand-line)}
.insight .ico svg{width:15px;height:15px}
.insight h4{font-size:13.5px}
.insight p{font-size:12.5px;color:var(--ink2);margin-top:2px}
.insight ul{margin:4px 0 0;padding-left:16px;font-size:12.5px;color:var(--ink2)}
.insight ul li{margin:1px 0}
.insight.warn{background:var(--warn-soft);border-color:var(--warn-line)} .insight.warn .ico{color:var(--warn);border-color:var(--warn-line)}
.insight.bad{background:var(--bad-soft);border-color:var(--bad-line)} .insight.bad .ico{color:var(--bad);border-color:var(--bad-line)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.kv.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.kv div{min-width:0}
.kv span{display:block;font-size:11.5px;color:var(--ink3)}
.kv b{display:block;font-weight:600;font-size:13px;overflow-wrap:anywhere}
.flags{display:flex;flex-wrap:wrap;gap:6px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11.5px;font-weight:600;color:var(--ink3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl th:first-child,.tbl td:first-child{padding-left:12px}
.tbl th:last-child,.tbl td:last-child{padding-right:12px}
.tbl tfoot td{font-weight:650;border-top:1px solid var(--line2);border-bottom:0;background:var(--sub)}
.tbl .sub td{font-weight:500;color:var(--ink2);background:none;border-top:0}
.tbl td.k{color:var(--ink2)}
.tbl .new{font-weight:650}
.tbl .was{color:var(--faint);text-decoration:line-through;font-weight:500;margin-right:6px}
.tbl tr.hl td{background:var(--warn-soft)}
.tbl tr.bd td{background:var(--bad-soft)}
.tbl .dd{color:var(--bad)}
.edit{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--ink3);padding:2px 4px;border-radius:5px}
.edit:hover{background:var(--hover);color:var(--brand-ink)}
.edit svg{width:13px;height:13px}
.inp{height:30px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);padding:0 8px;min-width:0}
.inp:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
.inp.w{width:100%}
.tbl .inp{height:28px;width:130px}
.wrap-tbl{border:1px solid var(--line);border-radius:var(--r);overflow:auto}
.money{display:grid;gap:4px}
.money .row{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.money .row span{color:var(--ink2)}
.money .row.tot{border-top:1px solid var(--line);padding-top:6px;margin-top:2px;font-weight:650}
.money .row.tot span{color:var(--ink)}
.money .row.dd b{color:var(--bad);font-weight:600}
.note{font-size:12px;color:var(--ink3)}
.callout{display:flex;gap:8px;padding:8px 10px;border-radius:7px;font-size:12.5px;background:var(--sub);border:1px solid var(--line);color:var(--ink2)}
.callout.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.callout.info{background:var(--info-soft);border-color:var(--info-line);color:var(--info)}
.callout.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.callout.bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.callout .ico svg{width:15px;height:15px}

/* timeline */
.tl{display:flex;flex-direction:column;gap:0;font-size:12.5px}
.tl .it{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.tl .it:last-child{border-bottom:0}
.tl .when{color:var(--ink3);font-size:11.5px}
.tl .who{font-weight:600}
.tl .out{margin-top:2px}

/* stepper (claims) */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;text-align:left;display:grid;gap:1px}
.stp:hover{background:var(--hover)}
.stp .n{font-size:11px;color:var(--ink3);font-weight:600;display:flex;align-items:center;gap:5px}
.stp .n svg{width:13px;height:13px}
.stp b{font-weight:650;font-size:13px}
.stp .s{font-size:11.5px;color:var(--ink3)}
.stp.on{border-color:var(--brand);box-shadow:inset 0 -2px 0 var(--brand)}
.stp.done .n{color:var(--ok)}
.stp.flag .n{color:var(--warn)}
.stp.red .n{color:var(--bad)}

/* ---------- document viewer ---------- */
.viewer{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;background:var(--sub);border-bottom:1px solid var(--line)}
.vmain{display:grid;grid-template-columns:96px minmax(0,1fr);min-height:0}
.vthumbs{display:flex;flex-direction:column;gap:6px;padding:8px 6px;overflow-y:auto;overflow-x:hidden;border-right:1px solid var(--line);background:var(--surface)}
.vthumb{flex:none;width:100%;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:4px;text-align:left;display:grid;gap:3px;position:relative}
.vthumb:hover{border-color:var(--line2)}
.vthumb.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.vthumb .pv{height:50px;border-radius:4px;overflow:hidden;background:#fff;display:grid;place-items:center;border:1px solid var(--line)}
.vthumb .pv svg{width:100%;height:100%}
.vthumb .nm{font-size:10.5px;line-height:1.2;font-weight:600;color:var(--ink2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:25px}
.vthumb .bdg{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:#fff}
.vthumb .bdg svg{width:10px;height:10px}
.vthumb .bdg.ok{background:var(--ok)} .vthumb .bdg.bad{background:var(--bad)} .vthumb .bdg.warn{background:var(--warn)}
.vbar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--surface);font-size:12.5px}
.vbar .dn{font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar .src{color:var(--ink3);font-size:11.5px;white-space:nowrap}
.vbar .sp{flex:1}
.vbar .ib{width:28px;height:28px}
.vbar .tg{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--surface)}
.vbar .tg input{margin:0;accent-color:var(--brand)}
.vstage{overflow:auto;padding:14px;display:flex;justify-content:center;align-items:flex-start;min-height:0}
.sheet{background:#fff;box-shadow:var(--paper-sh);border-radius:3px;flex:none;transition:transform .15s ease}
.sheet svg{display:block;width:100%;height:auto}
.vread{display:flex;flex-wrap:nowrap;gap:5px;padding:7px 10px;border-top:1px solid var(--line);background:var(--surface);font-size:12px;align-items:center;overflow-x:auto;white-space:nowrap;scrollbar-width:thin}
.vread .chip{flex:none}
.vread .lbl{font-weight:650;color:var(--ink3);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
.evid{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto}
.tab{border:0;background:none;padding:9px 10px 8px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center;white-space:nowrap;font-size:13px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--brand)}
.tab .c{font-size:11px;border-radius:999px;padding:0 6px;background:var(--hover);color:var(--ink2)}
.tab .c.bad{background:var(--bad-soft);color:var(--bad)} .tab .c.warn{background:var(--warn-soft);color:var(--warn)} .tab .c.ok{background:var(--ok-soft);color:var(--ok)}
.evid-b{overflow:auto;padding:4px 14px 14px}

/* checklist */
.ckg{padding-top:8px}
.ckg-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0 4px}
.ckg-h h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:650}
.ckg-h .x{font-size:11.5px;color:var(--ink3)}
.ck{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);align-items:start}
.ck:last-child{border-bottom:0}
.ck .ico{width:18px;height:18px;margin-top:1px}
.ck .ico svg{width:16px;height:16px}
.ck .tt{font-weight:600;font-size:13px}
.ck .dt{font-size:12px;color:var(--ink3);margin-top:1px}
.ck .dt b{color:var(--ink2);font-weight:600}
.ck .rt{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.ck input[type=checkbox]{width:16px;height:16px;margin:2px 0 0;accent-color:var(--ok)}
.ck.bad .tt{color:var(--bad)} .ck.warn .tt{color:var(--warn)}
.ck label{cursor:pointer}
.src{font-size:11px;color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:0 5px;white-space:nowrap}

/* fraud */
.score{display:flex;align-items:center;gap:12px}
.score .big{font-size:26px;font-weight:700;letter-spacing:-.02em}
.meter{height:6px;border-radius:6px;background:var(--hover);overflow:hidden;flex:1}
.meter i{display:block;height:100%;border-radius:6px}
.sig{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);align-items:start}
.sig:last-child{border-bottom:0}
.sig .w{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:4px;margin-top:2px}
.sig .w.h{background:var(--bad-soft);color:var(--bad)} .sig .w.m{background:var(--warn-soft);color:var(--warn)} .sig .w.l{background:var(--hover);color:var(--ink3)}
.sig .tt{font-weight:600}
.sig .dt{font-size:12px;color:var(--ink3)}

/* data source cards */
.dsrc{display:grid;gap:8px}
.ds{border:1px solid var(--line);border-radius:var(--r);padding:9px 11px}
.ds-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ds-h b{font-weight:650}
.ds ul{margin:5px 0 0;padding-left:16px;font-size:12.5px;color:var(--ink2)}
.ds ul li{margin:2px 0}
.chart{margin-top:6px}
.chart svg{display:block;width:100%;max-width:440px;height:auto}
.chart .ax{fill:var(--ink3);font-size:10px}
.chart .gl{stroke:var(--line)}
.chart .bar{fill:var(--brand)}
.chart .bar:hover{fill:var(--brand-ink)}

/* ---------- pages: search, queues ---------- */
.page{height:100%;overflow:auto;padding:18px 22px 40px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.page-h h1{font-size:20px}
.page-h p{color:var(--ink3);font-size:13px;margin-top:2px}
.srch{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.srch .q{position:relative;flex:1;max-width:720px}
.srch .q svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--ink3)}
.srch .q input{width:100%;height:38px;border:1px solid var(--line2);border-radius:8px;padding:0 12px 0 34px;background:var(--surface);font-size:14px}
.srch .q input:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
.srch select{height:38px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);padding:0 8px}
.bk{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.bkb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-weight:600;font-size:12.5px;color:var(--ink2);display:flex;gap:6px;align-items:center}
.bkb:hover{background:var(--hover)}
.bkb.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.bkb .c{font-size:11px;opacity:.75}
.res{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:auto}
.res .tbl td{vertical-align:middle}
.res .tbl tbody tr{cursor:pointer}
.res .tbl tbody tr:hover td{background:var(--hover)}
.res .id{font-weight:650;white-space:nowrap}
.res .tp{font-weight:600}
.empty{padding:40px 20px;text-align:center;color:var(--ink3)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h2{font-size:14px;display:flex;justify-content:space-between;align-items:center}
.card .h2s{font-size:12px;color:var(--ink3);margin-top:1px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center;font-size:13px}
.qrow:last-child{border-bottom:0}
.qrow b{font-weight:650;min-width:28px;text-align:right}
.qrow .lnk{font-size:11.5px}
.rules{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink2)}
.rules li{margin:5px 0}
.team{display:grid;gap:0}
.tm{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.tm:last-child{border-bottom:0}
.tm .nm{font-weight:600}
.tm .rl{font-size:12px;color:var(--ink3)}
.today{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.today div{padding:10px 14px;border-right:1px solid var(--line)}
.today div:last-child{border-right:0}
.today b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em}
.today span{font-size:12px;color:var(--ink3)}

/* ---------- idle and allocation states ---------- */
.idle{height:100%;display:grid;place-items:center;padding:24px}
.idle .in{max-width:460px;text-align:center;display:grid;gap:10px;justify-items:center}
.idle h2{font-size:18px}
.idle p{color:var(--ink3)}

.nextbar{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:30;background:var(--pri);color:var(--pri-ink);border-radius:10px;padding:8px 8px 8px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--sh);font-size:13px;max-width:calc(100% - 24px)}

/* ---------- modal, toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(16,14,40,.42);display:grid;place-items:center;z-index:50;padding:20px}

.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 18px 10px;border-bottom:1px solid var(--line)}

.mh p{font-size:12.5px;color:var(--ink3);margin-top:2px}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{border:1px dashed var(--line2);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--ink2);background:var(--sub);white-space:pre-wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;font-weight:600;font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}

.toasts{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);display:grid;gap:8px;z-index:60;justify-items:center;pointer-events:none}
.toast{background:var(--pri);color:var(--pri-ink);padding:9px 14px;border-radius:9px;box-shadow:var(--sh);font-size:13px;font-weight:550;max-width:560px;animation:tin .18s ease}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}

/* ---------- sign in ---------- */
.login{position:fixed;inset:0;display:grid;grid-template-columns:minmax(320px,44fr) 56fr;background:var(--surface)}

@media (max-width:1100px){

/* ---------- step journey ---------- */

.do{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}

.why{font-size:12px;color:var(--ink3);display:flex;gap:6px;align-items:center}

.outcome{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:14px 16px;border-radius:12px;border:1px solid var(--ok-line);background:var(--ok-soft)}
.outcome .ico svg{width:22px;height:22px}
.outcome b{font-size:16px;font-weight:700}
.outcome p{font-size:13px;color:var(--ink2);margin-top:2px}

.gates-h{display:flex;gap:12px;font-size:12px;font-weight:650;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:-6px}
.gates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gates.one{grid-template-columns:1fr}
.gate{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:9px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.gate .ico{margin-top:1px}

.gate.warn{border-color:var(--warn-line)}
.gate.bad{border-color:var(--bad-line);background:var(--bad-soft)}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:flex;gap:9px;align-items:center;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.line>svg{width:16px;height:16px;color:var(--ink3);flex:none}
.more{border-radius:10px}
.morebtn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--brand-ink);font-weight:600;font-size:12.5px;padding:4px 2px}
.morebtn:hover{text-decoration:underline}
.morebtn svg{width:14px;height:14px}
.morebtn .c{font-size:11px;background:var(--brand-soft);border-radius:999px;padding:0 7px;color:var(--brand-ink)}
.moreb{margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow:auto}
.moreb .gate{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0;background:none}
.moreb .gate:last-child{border-bottom:0}
.flow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px}
.fr{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;align-items:baseline}
.fr:last-child{border-bottom:0}
.fr span{display:grid}
.fr small{font-size:12px;color:var(--ink3)}
.fr b{font-weight:600;white-space:nowrap}
.fr.minus b{color:var(--bad)}
.fr.total{border-top:1.5px solid var(--ink);border-bottom:0;margin-top:2px}
.fr.total span{font-weight:650}
.fr.total b{font-size:17px;font-weight:700}
.bign{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.bign>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.bign span{font-size:12px;color:var(--ink3);font-weight:600}
.bign b{font-size:24px;font-weight:700;letter-spacing:-.02em}
.bign small{font-size:12px;color:var(--ink2)}
.bign .b{border-color:var(--brand-line);box-shadow:inset 3px 0 0 var(--brand)}
.subnav{display:flex;gap:6px;flex-wrap:wrap}
.subnav button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;font-weight:600;font-size:13px;color:var(--ink2)}
.subnav button:hover{background:var(--hover)}
.subnav button .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--hover);font-size:11px;color:var(--ink3)}
.subnav button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.subnav button.on .n{background:rgba(127,127,127,.3);color:inherit}
.subnav .c{font-size:11px;border-radius:999px;padding:0 6px;display:inline-grid;place-items:center;min-height:16px}
.subnav .c svg{width:11px;height:11px}
.subnav .c.warn{background:var(--warn-soft);color:var(--warn)}
.subnav .c.ok{background:var(--ok-soft);color:var(--ok)}
.subwrap{padding:12px 16px 0;background:var(--bg)}
.stack{display:flex;flex-direction:column;height:100%}
.stack .docstep{flex:1;min-height:0}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 14px}
.qbh{font-size:11.5px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);padding:8px 0 2px}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .tt{font-weight:600;font-size:13.5px}
.q .dt{font-size:12px;color:var(--ink3)}
.q .lnk{margin-top:2px}
.qa{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:none}
.qa button{border:0;background:var(--surface);padding:6px 10px;font-weight:600;font-size:12.5px;display:inline-flex;gap:5px;align-items:center;color:var(--ink2)}
.qa button+button{border-left:1px solid var(--line2)}
.qa button svg{width:13px;height:13px}
.qa button:hover{background:var(--hover)}
.qa button.on.ok{background:var(--ok);color:#fff}
.qa button.on.bad{background:var(--bad);color:#fff}
.qa button[disabled]{opacity:.5;cursor:not-allowed}
.q.yes .tt{color:var(--ok)} .q.no .tt{color:var(--bad)}
.cardkv{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.cardkv.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;display:grid;gap:2px}
.pick button:hover{border-color:var(--line2)}
.pick button.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.pick small{font-size:12px;color:var(--ink3);font-weight:600}
.pick b{font-size:22px;font-weight:700}
.pick span{font-size:12px;color:var(--ink2)}
.secs{display:grid;gap:8px}
.secs>div{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;padding:10px 12px;display:grid;gap:2px;font-size:13px}

.ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink2)}
.callout b{display:block}
.callout .lnk{margin-left:6px}
/* documents with questions */
.docstep{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);height:100%;min-height:0}
.dsl{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line);background:var(--bg)}
.dsl .do b{font-size:15px}
.dsr{min-height:0;display:flex}
.dsr .viewer{flex:1;border-bottom:0}
.dlist{display:grid;gap:4px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;text-align:left}
.dl:hover{border-color:var(--line2)}
.dl.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.dl .ico{color:var(--ink3)}
.dl b{display:block;font-weight:600;font-size:13px}
.dl small{font-size:11.5px}
.dq{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 12px}
.dqh{font-weight:650;font-size:13px;padding:8px 0 2px}
.dq .q{grid-template-columns:1fr;gap:6px}
.vmain.nothumbs{grid-template-columns:minmax(0,1fr)}
/* drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(520px,92%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--sh);z-index:20;display:flex;flex-direction:column;animation:drin .16s ease}
.drawer.wide{width:min(860px,94%)}
@keyframes drin{from{transform:translateX(24px);opacity:0}}
.dr-scrim{position:absolute;inset:0;background:rgba(16,14,40,.18);z-index:19}
.dr-h{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-right:8px}
.dr-h .tabs{border-bottom:0}
.dr-b{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.dr-b .viewer{flex:1;border-bottom:0}
.dpad{padding:14px 16px}
@media (max-width:1100px){
  .docstep{grid-template-columns:1fr;height:auto}
  .dsr{height:560px}
  .gates{grid-template-columns:1fr}
}
@media (max-width:760px){
  .pick,.cardkv.three{grid-template-columns:1fr}
  .q{grid-template-columns:1fr}
  .stepbar .sb .l small{display:none}
}

<script>
'use strict';
/* ---------- basics ---------- */
const NOW = Date.now();
const MIN = 6e4, HR = 36e5, DAY = 864e5;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const inr = n => (n < 0 ? '−₹' : '₹') + Math.round(Math.abs(n)).toLocaleString('en-IN');
const lakh = n => n >= 1e7 ? `₹${+(n / 1e7).toFixed(2)} crore` : n >= 1e5 ? `₹${+(n / 1e5).toFixed(2)} lakh` : inr(n);
const r0 = n => Math.round(n);
// a date that many days from now, at a set time of day
const at = (days, h = 10, m = 0) => { const d = new Date(NOW + days * DAY); d.setHours(h, m, 0, 0); return d.getTime(); };
const ago = mins => NOW - mins * MIN;
const fd = t => new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const fds = t => new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const ft = t => new Date(t).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
const fdt = t => { const d = new Date(t), td = new Date(); const same = d.toDateString() === td.toDateString(); const y = new Date(td.getTime() - DAY).toDateString() === d.toDateString(); return `${same ? 'Today' : y ? 'Yesterday' : fds(t)}, ${ft(t)}`; };
const days = (a, b) => Math.round((b - a) / DAY);
const wd = t => new Date(t).toLocaleDateString('en-GB', { weekday: 'short' });
const dur = ms => { const neg = ms < 0; ms = Math.abs(ms); const d = Math.floor(ms / DAY), h = Math.floor(ms % DAY / HR), m = Math.floor(ms % HR / MIN); const s = d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m} min`; return neg ? `${s} over` : s; };
const ageOn = (dob, t = NOW) => Math.floor((t - dob) / (365.25 * DAY));
const pct = n => `${Math.round(n * 100)}%`;
const uid = () => Math.random().toString(36).slice(2, 8);
const digits = n => Array.from({ length: n }, () => Math.floor(Math.random() * 10)).join('');
const plural = (n, w, p) => `${n} ${n === 1 ? w : p || w + 's'}`;

/* ---------- icons (stroke, 24 grid) ---------- */
const IC = {

  todo: '<circle cx="12" cy="12" r="8.5" stroke-dasharray="3 3"/>',
  wait: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>',
  spark: '<path d="M12 3l1.9 5.3L19 10l-5.1 1.7L12 17l-1.9-5.3L5 10l5.1-1.7z"/><path d="M19 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',

  c.state = { edits: {}, ticks: {}, doc: 0, zoom: null, rot: 0, marks: true, adj: {}, adjWhy: {}, editing: null, kyc: {}, more: {}, step: 1, sub: null, drawer: null };
  if (!c.lite) { buildDocs(c); c.log = c.log || []; }
});
const byId = id => ALL.find(c => c.id === id);
const ST = { user: null, avail: true, view: 'case', open: null, menu: false, search: { q: '', mod: 'all', lob: 'all', bucket: 'all', risk: false }, handled: [], nextMsg: null, nextAt: 0, booting: false };
const SEED_DONE = { u1: 6, u2: 9, u3: 4, u4: 5, u5: 3, u6: 2 };   // cases each person finished earlier today
const TEAM_STATUS = { u1: 'free', u2: 'free', u3: 'free', u4: 'free', u5: 'free', u6: 'free' };

/* ======================= allocation ======================= */
const dueAt = c => c.recv + c.tat;
const leftMs = c => dueAt(c) - Date.now();
const tatTone = c => { const f = leftMs(c) / c.tat; return f < 0.2 ? 'bad' : f < 0.5 ? 'warn' : 'ok'; };
const canDo = (u, c) => u.mods.includes(c.mod) && u.lobs.includes(c.lob);
function queueFor(u) { return ALL.filter(c => !c.lite && c.bucket === 'work' && canDo(u, c) && (!c.asg || c.asg === u.id)).sort((a, b) => dueAt(a) - dueAt(b)); }
function myOpen(u = ST.user) { return ALL.find(c => c.bucket === 'work' && c.asg === u.id); }
function allocate() {
  const u = ST.user; if (!u || u.sup || !ST.avail) return null;
  const cur = myOpen(u); if (cur) return cur;
  const n = queueFor(u).find(c => !c.asg);
  if (!n) return null;
  n.asg = u.id; n.asgAt = Date.now();
  n.log.push(L(Date.now(), 'Auto-allocation', `Assigned to ${u.name}. Rule: ${n.mod === 'claims' && n.lob === 'health' ? 'cashless first, then least time left' : 'least time left first'}, matched on ${MODS[n.mod].toLowerCase()} · ${LOBS[n.lob].toLowerCase()}`));
  return n;
}
function openNext() { ST.nextMsg = null; const n = allocate(); ST.open = n ? n.id : null; ST.view = 'case'; render(); }
let nextTimer = null;
function afterDecision(c, msg) {
  ST.handled.push({ id: c.id, t: Date.now(), what: msg });
  c.asg = c.bucket === 'work' ? c.asg : null;
  ST.open = null;
  if (!ST.user.sup && ST.avail && queueFor(ST.user).some(x => !x.asg)) {
    ST.nextMsg = msg; ST.nextAt = Date.now() + 4000; render();
    clearTimeout(nextTimer); nextTimer = setTimeout(() => { if (ST.nextMsg && ST.avail) openNext(); }, 4000);
  } else { ST.nextMsg = null; toast(msg); render(); }
}

/* ======================= small render helpers ======================= */
function tatHtml(c) {
  const left = leftMs(c), tone = tatTone(c), used = Math.min(1, Math.max(0, 1 - left / c.tat));
  const short = c.tat <= 3 * HR;
  const main = left < 0 ? `${dur(-left)} over` : short ? `${dur(left)} left` : `Day ${Math.max(1, Math.ceil((Date.now() - c.recv) / DAY))} of ${Math.round(c.tat / DAY)}`;
  const sub = short ? `Due ${ft(dueAt(c))}` : `Due ${fds(dueAt(c))}${left < 2 * DAY && left > 0 ? `, ${dur(left)} left` : ''}`;
  return `<div class="tat ${tone}" data-tat="${c.id}"><div class="l"><span class="mut">${esc(c.tatName)}</span><b>${main}</b></div><div class="bar"><i style="width:${Math.round(used * 100)}%"></i></div><div class="s">${sub}</div></div>`;
}
const lobIc = l => ({ motor: 'car', health: 'heart', property: 'home' }[l]);
const bucketChip = c => { const k = { work: 'brand', cust: 'warn', ir: 'info', ret: 'warn', ref: 'info', closed: 'ok' }[c.bucket]; const t = c.bucket === 'closed' && c.outcome ? c.outcome.t : c.bucket === 'ref' && c.ref ? `With ${c.ref.to}` : BUCKETS[c.bucket].t; return chip(esc(t), k); };
function insightHtml(c, extra = '') {

  const btn = i.fix && ST.user && c.asg === ST.user.id && c.bucket === 'work' && c.state.edits[i.fix.k] !== i.fix.v ? `<button class="btn xs" data-act="fix">${ic('pen')}${esc(i.fix.label)}</button>` : '';

}

/* ======================= calculations ======================= */
function assessH(c) {
  const Lm = c.limits || {}, cap = Lm.roomCap || 0, room = (c.bill || []).find(b => b.cat === 'room' && b.rate);
  const ratio = cap && room && room.rate > cap ? cap / room.rate : 1;
  const rows = c.bill.map((b, i) => {
    let np = 0, prop = 0, why = b.why || '';
    if (b.cat === 'np') np = b.amt;
    else if (b.cat === 'room' && cap && b.rate > cap) { prop = b.amt - cap * b.days; why = `Plan pays up to ${inr(cap)} a day`; }
    else if (b.cat === 'ame' && ratio < 1) { prop = b.amt * (1 - ratio); why = `Paid in the same share as the room, ${Math.round(ratio * 100)}%`; }
    const adj = c.state.adj[i] || 0;
    if (adj) why = c.state.adjWhy[i] || 'Deducted by you';
    return { ...b, i, np, prop, adj, pay: Math.max(0, b.amt - np - prop - adj), why };
  });
  const s = k => rows.reduce((a, r) => a + r[k], 0);
  const billed = s('amt'), np = s('np'), prop = s('prop'), adj = s('adj'), adm = s('pay');
  const copay = adm * (Lm.copay || 0), avail = c.si.base + c.si.bonus - c.si.used, pay = Math.min(adm - copay, avail);
  return { rows, billed, np, prop, adj, adm, copay, pay, ratio, patient: billed - pay, avail };
}
function assessM(c) {
  const md = metalDep(c.veh.age);
  const rows = c.parts.map(p => { const r = p.m === 'metal' ? md : (MOTOR_DEP[p.m] || 0); return { ...p, r, dep: p.ass * r }; });
  const paintMat = c.paint.ass * 0.25, paintDep = paintMat * 0.5;
  const partsAss = rows.reduce((a, r) => a + r.ass, 0), est = rows.reduce((a, r) => a + r.est, 0) + c.labour.est + c.paint.est;
  const assessed = partsAss + c.labour.ass + c.paint.ass, dep = rows.reduce((a, r) => a + r.dep, 0) + paintDep;

  if (c.kind === 'hpre' && k === 'amt') {
    const est = c.est.reduce((a, r) => a + r[1], 0), amt = claimAmount(c);
    return doLine('Choose how much to approve now', 'Our package is what we agreed with this hospital for this surgery. Anything more is looked at with the final bill.') + `<div class="pick"><button class="${amt === c.pkg.amt ? 'on' : ''}" data-act="amt" data-v="${c.pkg.amt}" ${ro ? 'disabled' : ''}><small>Agreed package · suggested</small><b>${inr(c.pkg.amt)}</b><span>Room, surgeon, anaesthesia, theatre, routine medicines</span></button><button class="${amt === est ? 'on' : ''}" data-act="amt" data-v="${est}" ${ro ? 'disabled' : ''}><small>Hospital's estimate</small><b>${inr(est)}</b><span>${Math.round((est / c.pkg.amt - 1) * 100)}% above the package</span></button></div>
      <div class="line">${ic('pen')}<span>Or type an amount: <input class="inp" id="amt" type="number" value="${amt}" ${ro ? 'disabled' : ''} style="width:130px;margin-left:6px" aria-label="Amount to approve"></span></div>` + more(c, 'est', 'See the estimate line by line', `<table class="tbl">${c.est.map(r => `<tr><td>${esc(r[0])}</td><td class="num">${inr(r[1])}</td></tr>`).join('')}</table>`);
  }
  if (c.kind === 'hfinal' && k === 'med') return doLine('Check the stay matches the illness') + kv([['Diagnosis', `${esc(K.dx)} <span class="mut sm">${K.icd}</span>`], ['Backed by', 'Oxygen 88% on arrival, CRP 112, X-ray and CT show pneumonia'], ['Stay', '4 days: 1 in ICU, 3 in a room'], ['Usual stay', esc(K.typical)]], 'cardkv');
  if ((c.kind === 'hfinal' || c.kind === 'hreimb') && k === 'bill') {
    const a = assessH(c), rows = [['Billed by the hospital', a.billed, 'base']];
    if (a.np) rows.push(['Items that aren\'t payable', a.np, 'minus', c.kind === 'hreimb' ? 'Service and registration charges' : 'Admission kit and toiletries']);
    if (a.prop) rows.push(['Room above the plan limit', a.prop, 'minus', 'Room is ₹7,500 a day; the plan pays ₹5,000, and the same share of doctor and nursing']);
    if (a.adj) rows.push(['Deducted by you', a.adj, 'minus']);
    if (a.copay) rows.push(['Co-pay', a.copay, 'minus', c.limits.copayNote]);
    rows.push([c.kind === 'hfinal' ? 'NxSure pays the hospital' : 'Payable if the claim is genuine', a.pay, 'total']);
    const lines = a.rows.map(r => { const cut = r.np + r.prop + r.adj; return `<tr><td><b style="font-weight:600">${esc(r.h)}</b><div class="sm mut">${esc(r.d)}</div>${cut ? `<div class="sm dd">${esc(r.why)}</div>` : ''}</td><td class="num">${inr(r.amt)}</td><td class="num ${cut ? 'dd' : 'mut'}">${cut ? '−' + inr(cut) : '—'}</td><td class="num b">${inr(r.pay)}</td><td class="num">${!ro && r.cat !== 'np' ? `<button class="edit" data-act="adj" data-i="${r.i}" title="Deduct">${ic('minus')}</button>` : ''}</td></tr>`; }).join('');
    return doLine(c.kind === 'hfinal' ? 'Check what we pay on the final bill' : 'See what would be payable', c.kind === 'hfinal' ? 'The bill was read line by line. Open it only if something looks wrong.' : 'Only if the investigation says the claim is genuine.') + flow(rows) + (c.kind === 'hfinal' ? `<div class="line">${ic('user')}<span>Patient pays <b>${inr(a.patient)}</b> at discharge.</span></div>` : '') + more(c, 'lines', 'See the bill line by line', `<table class="tbl"><thead><tr><th>Line</th><th class="num">Billed</th><th class="num">Not paid</th><th class="num">Payable</th><th></th></tr></thead><tbody>${lines}</tbody></table><p class="note">Medicines, consumables, implants, tests and ICU are paid in full: IRDAI doesn't allow the room-rent share on them.</p>`, a.rows.length);
  }
  if (c.kind === 'hreimb' && k === 'flags') {
    const f = c.fraud, top = f.signals.filter(x => x.w === 'h');
    return doLine('Read the strongest red flags and decide if a field visit is needed') + `<div class="score"><span class="big st-bad">${f.score}</span><div style="flex:1"><div class="sm"><b>High risk</b> <span class="mut">out of 100</span></div><div class="meter" style="margin-top:6px"><i style="width:${f.score}%;background:var(--bad)"></i></div></div></div>
      <div class="gates one" style="margin-top:10px">${top.map(x => gateRow({ t: x.t, r: x.d, st: 'bad' })).join('')}</div>` + more(c, 'allf', 'See all red flags and linked claims', `<div class="gates one">${f.signals.filter(x => x.w !== 'h').map(x => gateRow({ t: x.t, r: x.d, st: x.w === 'm' ? 'warn' : 'info' })).join('')}</div>${graphSvg()}`, f.signals.length);
  }
  if (c.kind === 'hreimb' && k === 'med') return doLine('Compare the treatment with the test results') + kv([['Diagnosis', `${esc(K.dx)} <span class="mut sm">${K.icd}</span>`], ['Tests on arrival', 'Sodium 138, potassium 4.1, creatinine 0.9, BP 118/76: all normal'], ['Treatment', '2 days in ICU, 1 in a ward'], ['Usual', esc(K.typical)]], 'cardkv');
  if (c.kind === 'mod' && k === 'survey') { const a = assessM(c); return doLine('Check the survey matches the photos and the accident') + kv([['Cause', 'Rear-ended at a signal. Matches what she reported'], ['Photos', 'Fresh damage, same parts as the survey'], ['Asked and assessed', `${inr(a.est)} asked by the garage, ${inr(a.assessed)} assessed`], ['Surveyor', `${esc(c.survey.name)}, licensed`]], 'cardkv') + more(c, 'parts', 'See parts and labour', partsTbl(c, a), a.rows.length + 2); }
  if (c.kind === 'mod' && k === 'dep') { const a = assessM(c); return doLine('Check depreciation, the deductible and salvage', `The car is ${Math.floor(c.veh.age / 12)} years ${c.veh.age % 12} months old: metal parts at ${Math.round(a.md * 100)}%, plastic at 50%, glass nil. She has no zero-depreciation cover.`) + flow([['Assessed by the surveyor', a.assessed, 'base'], ['Depreciation on parts and paint', a.dep, 'minus'], ['Compulsory deductible', c.deductible, 'minus', 'Up to 1,500 cc'], ['Salvage kept by the garage', c.salvage, 'minus'], ['NxSure pays the garage', a.pay, 'total']]) + `<div class="line">${ic('user')}<span>Customer pays <b>${inr(a.cust)}</b> at the garage.</span></div>` + more(c, 'parts2', 'See depreciation part by part', partsTbl(c, a), a.rows.length + 2); }
  if (c.kind === 'theft' && k === 'inv') return doLine('Confirm the theft is genuine') + kv([['Investigation', 'Genuine theft. Society CCTV shows two men taking it at 2:14 am'], ['Police', 'Closed as untraced'], ['Keys', '1 of 2. Indemnity bond signed for the lost one'], ['Since the theft', 'No traffic fines; not on IIB with another insurer']], 'cardkv');
  if (c.kind === 'theft' && k === 'set') return doLine('Check the amount we pay', 'We pay the cover amount, not the price of a new bike.') + flow([['Asked for', c.claimed, 'base', 'The bike\'s price today'], ['Cover amount (IDV)', c.idv, 'base', 'The most this policy can pay'], ['Compulsory deductible', c.deductible, 'minus', 'Two-wheeler'], ['NxSure pays Arun Prakash', c.idv - c.deductible, 'total']]);
  if (c.kind === 'fire' && k === 'survey') return doLine('Confirm the cause and the loss') + kv([['Cause', 'Short circuit at the main switchboard, after closing. Confirmed by the fire brigade'], ['Loss', 'Stock ₹8,20,000 · fittings ₹1,10,000'], ['Stock records', 'Stock register and GST returns back ₹31.4 lakh of stock'], ['Surveyor', `${esc(c.survey.name)}, licensed`]], 'cardkv');
  if (c.kind === 'fire' && k === 'under') { const a = assessF(c); return doLine('Check the average clause is applied only where it should be', 'This product forgives underinsurance up to 15% of the value at risk.') + `<div class="secs">${a.rows.map(r => `<div class="${r.avg ? 'warn' : 'ok'}"><b>${esc(r.s)}</b><span>Cover ${lakh(r.si)} · at risk ${lakh(r.var)} · ${pct(r.short)} short</span><span>${r.avg ? 'Paid in proportion' : 'Paid in full'}: <b>${inr(r.pay)}</b> of ${inr(r.loss)}</span></div>`).join('')}</div>` + flow([['Payable on both sections', a.gross, 'base'], ['Excess for each claim', c.excess, 'minus'], ['NxSure pays Vastra Collections', a.pay, 'total']]); }
  return '';
}
function partsTbl(c, a) {
  return `<table class="tbl"><thead><tr><th>Part</th><th>Material</th><th class="num">Assessed</th><th class="num">Dep.</th><th class="num">Less</th></tr></thead><tbody>${a.rows.map(r => `<tr><td>${esc(r.p)}</td><td class="sm">${r.m[0].toUpperCase() + r.m.slice(1)}</td><td class="num">${inr(r.ass)}</td><td class="num">${Math.round(r.r * 100)}%</td><td class="num dd">${r.dep ? '−' + inr(r.dep) : '—'}</td></tr>`).join('')}<tr><td>Labour</td><td></td><td class="num">${inr(c.labour.ass)}</td><td class="num">0%</td><td class="num mut">—</td></tr><tr><td>Painting</td><td class="sm">25% is material</td><td class="num">${inr(c.paint.ass)}</td><td class="num">50%</td><td class="num dd">−${inr(a.paintDep)}</td></tr></tbody></table>`;
}

/* ======================= underwriting ======================= */
function uwStep(c, s, ro) {
  if (s === 1) {
    const flag = c.dvf.filter(r => r.st !== 'ok');
    return `<div class="wrapc">${doLine('Check what was declared against what we found', `${flag.length} of ${c.dvf.length} don't match. The rest agree.`)}
      ${kv([['Proposer', esc(c.cust.name)], ['Cover asked for', esc(c.pol.plan)], ['Insured', esc(c.pol.obj)]], 'cardkv three')}
      <div class="flags">${c.triggers.join('')}</div>
      <div class="gates one">${flag.map(r => gateRow({ t: `${r.item}${r.who ? ' · ' + r.who : ''}`, r: `Declared: ${r.dec}. Found: ${r.found}`, st: r.st })).join('')}</div>
      ${more(c, 'dvf', 'See everything that matches', `<div class="gates one">${c.dvf.filter(r => r.st === 'ok').map(r => gateRow({ t: `${r.item}${r.who ? ' · ' + r.who : ''}`, r: `Declared: ${r.dec}. Found: ${r.found}`, st: 'ok' })).join('')}</div>`, c.dvf.filter(r => r.st === 'ok').length)}
      <p class="why">${ic('info')} ${esc(c.why)}</p></div>`;
  }
  if (s === 2) {
    const subs = [['docs', 'Documents']].concat(c.med ? [['med', 'Medical']] : []).concat(c.damages ? [['dmg', 'Inspection']] : []).concat(c.warranties ? [['risk', 'Risk survey']] : []).concat([['data', 'Data sources']]);
    const cur = subs.find(x => x[0] === c.state.sub) ? c.state.sub : 'docs';
    const nav = `<div class="subnav inset" role="tablist">${subs.map(([k, t], i) => `<button class="${k === cur ? 'on' : ''}" data-act="sub" data-k="${k}" role="tab"><span class="n">${i + 1}</span>${esc(t)}${k === 'docs' && qOpen(c).length ? `<span class="c warn">${qOpen(c).length}</span>` : ''}</button>`).join('')}</div>`;
    if (cur === 'docs') return `<div class="stack"><div class="subwrap">${nav}</div>${docStep(c, ro, 'Look at each document and confirm what it shows')}</div>`;
    let b = '';
    if (cur === 'med') { const off = c.med.filter(m => m.st !== 'ok'); b = doLine('Look at the results outside the normal range', `${off.length} of ${c.med.length} are outside the range.`) + `<div class="gates one">${off.map(m => gateRow({ t: `${m.test} · ${m.who}`, r: `${m.val} ${m.unit}${m.range ? ', normal ' + m.range : ''}`, st: m.st })).join('')}</div>` + more(c, 'medall', 'See all results', `<div class="gates one">${c.med.filter(m => m.st === 'ok').map(m => gateRow({ t: `${m.test} · ${m.who}`, r: `${m.val} ${m.unit}${m.range ? ', normal ' + m.range : ''}`, st: 'ok' })).join('')}</div>`, c.med.length - off.length); }
    else if (cur === 'dmg') b = doLine('These damages were found in the self-inspection video', 'Accepting with conditions excludes them, so they can\'t be claimed later.') + `<div class="gates one">${c.damages.map(d => gateRow({ t: d.t, r: 'Seen in the video', st: 'bad', doc: 'v1' })).join('')}</div>`;
    else if (cur === 'risk') b = doLine('These hazards were seen on the video survey', 'Your terms should answer each one, with a warranty or a higher rate.') + `<div class="gates one">${[['bad', 'Electrical panel next to the solvent store'], ['bad', 'No hydrant system, though one was declared'], ['warn', 'Stock within 1 m of the lights in 2 bays'], ['warn', 'No "No smoking" signs']].map(([st, t]) => gateRow({ t, r: 'Seen on the video survey', st, doc: 'vs' })).join('')}</div>` + more(c, 'okrisk', 'See what was fine', `<div class="gates one">${gateRow({ t: '12 extinguishers, refilled Sep 2026', r: '', st: 'ok' })}${gateRow({ t: 'RCC building, clear exits, fire NOC valid', r: '', st: 'ok' })}</div>`, 2);
    else if (cur === 'data') b = doLine('See what other data says about this proposal') + `<div class="gates one">${c.data.map((d, i) => gateRow({ t: d.src, r: d.lines[0], st: d.st === 'info' ? 'info' : d.st })).join('')}</div>` + c.data.map((d, i) => more(c, 'ds' + i, `See ${d.src} in detail`, `<div class="sm mut">${esc(d.t)}</div><ul class="ul">${d.lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>${d.chart ? barChart(d.chart) : ''}`)).join('');
    return `<div class="wrapc">${nav}${b}</div>`;
  }
  return decideHtml(c, ro);
}

/* ======================= the decision step, all modules ======================= */
function custLines(c) {
  const amt = claimAmount(c);
  if (c.kind === 'hpre') return [`Cashless approved: ${inr(amt)} for ${c.clin.proc.toLowerCase()} at ${c.hosp.name}.`, 'Room: any single private room, as the plan allows.', `Anything above ${inr(amt)} is reviewed at discharge with the final bill.`];
  if (c.kind === 'hfinal') { const a = assessH(c); return [`NxSure pays ${c.hosp.name} ${inr(a.pay)}.`, `${c.patient.name} pays ${inr(a.patient)} at discharge:`, `· room above the plan's ₹5,000 a day, and the same share of doctor and nursing charges: ${inr(a.prop)} (Essential plan, room rent limit)`, `· items IRDAI lists as not payable: ${inr(a.np)}`, `· 20% co-pay from age 61: ${inr(a.copay)} (Essential plan, co-pay)`]; }
  if (c.kind === 'hreimb') { const a = assessH(c); return [`If approved: ${inr(a.pay)} to Coastal Bank •••• 7718.`, `Not payable: service and registration charges, ${inr(a.np)}.`]; }
  if (c.kind === 'mod') { const a = assessM(c); return [`NxSure pays ${c.garage.name} ${inr(a.pay)} directly.`, `${c.cust.name} pays ${inr(a.cust)} at the garage: depreciation ${inr(a.dep)}, deductible ${inr(c.deductible)}, salvage ${inr(c.salvage)}.`, 'The no-claim bonus goes to 0% at renewal.']; }
  if (c.kind === 'theft') return [`NxSure pays Arun Prakash ${inr(amt)} to Kaveri Bank •••• 0932.`, `That is the cover amount of ${inr(c.idv)} less the ₹100 deductible. The ₹1,90,000 asked for is above the cover.`, 'The policy ends on payment; the bike, if found, belongs to NxSure.'];
  if (c.kind === 'fire') { const a = assessF(c); return [`NxSure pays Vastra Collections ${inr(a.pay)} to Unity Bank •••• 5170.`, `Stock is paid in proportion because it was insured for ${lakh(a.rows[0].si)} against ${lakh(a.rows[0].var)} at risk (underinsurance clause).`, `Fittings are paid in full. Excess ${inr(c.excess)}.`]; }
  return [];
}

function decideHtml(c, ro) {
  const open = qOpen(c), no = qNo(c), u = ST.user;
  const pending = open.length ? `<div class="callout warn"><span class="ico">${ic('warn')}</span><div><b>${plural(open.length, 'thing')} still to confirm</b>${open.map(t => `<div class="sm">${esc(t.t)} <button class="lnk" data-act="goq" data-id="${t.id}">Go there</button></div>`).join('')}</div></div>` : '';
  const nos = no.length ? `<div class="callout bad"><span class="ico">${ic('bad')}</span><div><b>You marked ${plural(no.length, 'item')} as not correct</b>${no.map(t => `<div class="sm">${esc(t.t)}</div>`).join('')}<div class="sm">Raise ${c.mod === 'uw' ? 'a requirement' : 'an IR'} or ${c.mod === 'claims' ? 'recommend a decline' : 'decline'} instead of approving.</div></div></div>` : '';
  let main = '';
  if (c.mod === 'ops') {
    const m = c.money(c);
    const nums = m.kind === 'refund' ? [['Refund', inr(m.total), 'b', c.bank.ok ? `To ${c.bank.t}` : 'No account to send it to']] : m.kind === 'collect' ? [['Extra premium', inr(m.total), 'b', m.paid != null && Math.abs(m.paid - m.total) < 1 ? 'Already paid' : m.paid > m.total ? `${inr(m.paid - m.total)} goes back` : `${inr(m.total - (m.paid || 0))} to collect`]] : [['Premium', 'No change', 'b']];
    main = `${bigNums(nums)}<div class="line">${ic('info')}<span><b>When you approve:</b> ${esc(c.effect)}</span></div>${c.kind === 'cancel' && !c.bank.ok ? `<div class="callout bad"><span class="ico">${ic('bank')}</span><span><b>${esc(c.bank.t)}.</b> ${esc(c.bank.d)} Raise an IR for bank details.</span></div>` : ''}`;
  } else if (c.mod === 'claims') {
    const amt = claimAmount(c), payee = c.kind === 'hpre' || c.kind === 'hfinal' ? c.hosp.name : c.kind === 'mod' ? c.garage.name : c.cust.name;
    const cp = c.kind === 'hfinal' ? assessH(c).patient : c.kind === 'mod' ? assessM(c).cust : 0;
    main = bigNums([[c.kind === 'hpre' ? 'Approve now, cashless' : c.kind === 'hreimb' ? 'Payable if genuine' : 'NxSure pays', inr(amt), 'b', payee]].concat(cp ? [[c.kind === 'mod' ? 'Customer pays at the garage' : 'Patient pays at discharge', inr(cp), '', '']] : []))
      + (c.kind === 'hreimb' ? `<div class="callout bad"><span class="ico">${ic('flag')}</span><span><b>Suggested: send for field investigation.</b> Three strong red flags. The customer is only told we're checking the claim.</span></div>` : '')
      + (amt > u.limit && c.kind !== 'hpre' ? `<div class="callout warn"><span class="ico">${ic('warn')}</span><span>${inr(amt)} is above your limit of ${inr(u.limit)}. Approving sends it to Kavita Shah with your note.</span></div>` : '')
      + more(c, 'tell', 'See what the customer will be told', `<div class="preview">${custLines(c).map(esc).join('\n')}</div>`);
  } else {
    if (c.kind === 'uwh') { const base = premH(c, {}), sug = premH(c, c.suggest.load || {}), cur = premH(c, c.state.loads || c.suggest.load || {}); main = bigNums([['At standard terms', inr(base.final), '', 'If you accept'], [c.suggest.load && Object.keys(c.suggest.load).length ? 'With the suggested loading' : 'Suggested', c.suggest.load && Object.keys(c.suggest.load).length ? inr(sug.final) : esc(c.suggest.text), 'b', c.suggest.text]]); }
    else if (c.kind === 'uwm') { const q = premM(c, null), r = premM(c, c.state.terms || { zd: false }); main = bigNums([['Paid at the quote', inr(q.total), '', '25% bonus, zero depreciation'], ['With the suggested conditions', inr(r.total), 'b', 'Bonus 0%, damage excluded, no zero depreciation']]); }
    else { const r = premS(c, c.state.terms || { rate: c.sme.suggestRate, load: c.sme.claimLoad }); main = bigNums([['Sum insured', lakh(c.sme.tsi), '', 'One location'], ['Premium at the suggested terms', inr(r.total), 'b', `${(c.state.terms || { rate: c.sme.suggestRate }).rate.toFixed(2)} per mille, +${(c.state.terms || { load: c.sme.claimLoad }).load}%, with GST`]]); }
  }
  return `<div class="wrapc">${doLine(c.bucket === 'ref' && c.refTo === u.id ? 'Approve, or send it back' : 'Make the decision', open.length || no.length ? '' : 'Everything is checked.')}${insightHtml(c)}${main}${nos}${pending}</div>`;
}

/* ======================= footer: what to do on this step ======================= */
function footHtml(c, mine, s) {
  const B = (act, label, k = '', extra = '') => `<button class="btn ${k}" data-act="${act}" ${extra}>${label}</button>`;
  const back = s > 1 ? B('step', `${ic('back')}Back`, 'ghost', `data-s="${s - 1}"`) : '';
  if (!mine) return `<div class="case-f"><div class="hint">${ic('eye')}<span>You can look, but only the person it's assigned to can decide.</span></div><div class="acts">${back}${s < 3 ? B('step', `Next${ic('arrow')}`, '', `data-s="${s + 1}"`) : ''}<button class="btn" data-act="nav" data-v="search">${ic('search')}Back to search</button></div></div>`;
  const u = ST.user, sug = c.insight.act, open = qOpen(c).length, no = qNo(c).length, gate = open || no ? 'disabled' : '';
  if (c.bucket === 'ref' && c.refTo === u.id) return `<div class="case-f"><div class="hint">${ic('info')}<span>Sent by <b>${esc(userById(c.ref.by).name)}</b>: ${esc(c.ref.note || c.ref.why)}</span></div><div class="acts">${B('sendback', 'Send back')}${B('supapprove', `Approve ${inr(c.ref.amt)}`, 'pri')}</div></div>`;
  const ir = c.mod === 'uw' ? 'Raise requirement' : c.mod === 'claims' ? (c.channel.startsWith('Hospital') ? 'Query hospital' : 'Ask for documents') : 'Raise IR';
  let hint = '', acts = '';
  if (s < 3) {
    if (c.mod === 'claims' && s === 1) {
      hint = 'Choose where this claim goes next.';
      const notAdm = c.kind === 'hpre' ? B('deny', 'Deny cashless', 'dng') : B('decline', 'Not admissible', 'dng');
      acts = notAdm + B('ir', ir) + (c.gate.out.route === 'inv' ? B('step', 'Assess anyway', '', 'data-s="2"') + B('inv', 'Send for investigation', 'pri') : B('step', `Go to assessment${ic('arrow')}`, 'pri', 'data-s="2"'));
    } else if (c.mod === 'claims' && s === 2) {
      const subs = claimSubs(c), i = Math.max(0, subs.findIndex(x => x[0] === c.state.sub)), nx = subs[i + 1];
      const left = subs[i][2].filter(id => c.state.ticks[id] === undefined).length;
      hint = left ? `Confirm ${plural(left, 'item')} above, then continue.` : `${subs[i][1]} done.`;
      acts = B('ir', ir) + back + (nx ? B('sub', `Next: ${esc(nx[1])}${ic('arrow')}`, 'pri', `data-k="${nx[0]}"`) : B('step', `Continue to the decision${ic('arrow')}`, 'pri', 'data-s="3"'));
    } else {
      const n = qOpen(c).length;
      hint = s === 1 ? `Step 1 of 3. Next: ${c.mod === 'ops' ? 'confirm the documents' : 'look at the evidence'}.` : n ? `${plural(n, 'item')} still to confirm.` : 'All confirmed.';
      acts = (c.mod === 'ops' && s === 1 ? B('reject', 'Reject', 'dng') : '') + B('ir', ir, sug === 'ir' || sug === 'req' ? 'pri' : '') + back + B('step', `${s === 1 ? (c.mod === 'ops' ? 'Continue to documents' : 'Continue to evidence') : 'Continue to decide'}${ic('arrow')}`, sug === 'ir' || sug === 'req' ? '' : 'pri', `data-s="${s + 1}"`);
    }
    return `<div class="case-f"><div class="hint">${ic('info')}<span>${hint}</span></div><div class="acts">${acts}</div></div>`;
  }
  hint = no ? 'Something was marked not correct.' : open ? `${plural(open, 'item')} still to confirm before you approve.` : 'Ready to decide.';

    note: c.pwd ? { k: 'warn', t: 'Disability on its own can\'t be a reason to decline. IRDAI requires every proposal from a person with a disability to be judged on the medical risk alone.' } : { t: 'The customer gets the reason in writing and a full refund of the premium within 7 days.' },
    extra: c.lob === 'health' ? `<div class="fld"><label for="pm">If postponing, apply again after</label><select id="pm"><option value="3">3 months</option><option value="6" selected>6 months</option><option value="12">12 months</option></select></div>` : '',
    onOk: (t, r, s) => { const pp = /Postpone/.test(t); c.bucket = 'closed'; c.by = ST.user.id; c.outcome = { t: pp ? 'Postponed' : 'Declined', st: 'bad', when: Date.now(), d: `${t}${pp ? ', apply again after ' + $('#pm', s).value + ' months' : ''}. Premium refunded` }; c.log.push(L(Date.now(), ST.user.name, `${pp ? 'Postponed' : 'Declined'}: ${t}${r ? '. ' + r : ''}. Premium refund started`)); afterDecision(c, `${c.id} ${pp ? 'postponed' : 'declined'}. Premium refund started.`); } });
}

/* ======================= release ======================= */
function releaseModal(c) {
  const s = modal(mh('Release this case', 'It goes back to the top of the queue for someone else') + `<div class="mb"><div class="fld"><label for="rl">Why</label><select id="rl"><option>I need a supervisor's view</option><option>Conflict of interest</option><option>Not my skill</option><option>Going on a break</option></select></div></div>` + mf('Release', ''));
  $('[data-ok]', s).addEventListener('click', () => { const why = $('#rl', s).value; c.asg = null; c.asgAt = null; c.log.push(L(Date.now(), ST.user.name, `Released to the queue: ${why}`)); if (why === 'Going on a break') ST.avail = false; closeModal(); ST.open = null; toast(`${c.id} is back in the queue.`); if (ST.avail) openNext(); else render(); });
}

/* ======================= events ======================= */
document.addEventListener('click', e => {
  const okb = e.target.closest('[data-close]'); if (okb) { closeModal(); return; }
  const el = e.target.closest('[data-act]'); if (!el) { if (ST.menu && !e.target.closest('.menu')) { ST.menu = false; render(); } return; }
  const a = el.dataset.act, c = ST.open ? byId(ST.open) : null;
  if (a !== 'menu' && ST.menu) ST.menu = false;
  switch (a) {
    case 'login': signIn(el.dataset.u); break;
    case 'nav': ST.view = el.dataset.v; if (el.dataset.v === 'case' && !ST.user.sup) { const m = myOpen(); ST.open = m ? m.id : null; if (!m && ST.avail) { openNext(); return; } } if (el.dataset.v === 'case' && ST.user.sup) ST.open = null; render(); break;
    case 'menu': ST.menu = !ST.menu; render(); break;
    case 'switch': case 'signout': ST.user = null; ST.open = null; ST.menu = false; ST.nextMsg = null; clearTimeout(nextTimer); ST.handled = []; render(); break;
    case 'theme': { const r = document.documentElement, dark = r.dataset.theme === 'dark' || (!r.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches); r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('nxwb-theme', r.dataset.theme); } catch (x) { } render(); break; }
    case 'avail': ST.avail = !ST.avail; if (!ST.avail) { ST.nextMsg = null; clearTimeout(nextTimer); toast('Paused. No new cases until you resume.'); render(); } else { toast('Taking cases again.'); if (!myOpen() && ST.view === 'case') openNext(); else render(); } break;
    case 'opennow': clearTimeout(nextTimer); openNext(); break;
    case 'pausenext': clearTimeout(nextTimer); ST.nextMsg = null; ST.avail = false; render(); break;
    case 'open': { const x = byId(el.dataset.id); if (!x) return; if (x.bucket === 'ref' && x.refTo === ST.user.id) x.state.step = 3; ST.open = x.id; ST.view = 'case'; render(); break; }
    case 'step': c.state.step = +el.dataset.s; c.state.drawer = null; c.state.editing = null; if (c.state.step === 2 && c.mod === 'claims' && !c.state.sub) c.state.sub = claimSubs(c)[0][0]; if (c.state.step === 2 && c.mod !== 'claims') firstOpenDoc(c); render(); $('.cbody') && ($('.cbody').scrollTop = 0); break;
    case 'sub': c.state.sub = el.dataset.k; c.state.step = 2; c.state.drawer = null; if (c.mod === 'uw' && el.dataset.k === 'docs') firstOpenDoc(c); render(); $('.cbody') && ($('.cbody').scrollTop = 0); break;
    case 'more': c.state.more[el.dataset.k] = !c.state.more[el.dataset.k]; render(); break;
    case 'drawer': c.state.drawer = el.dataset.t || null; render(); break;
    case 'ans': {
      const v = el.dataset.v === '1', t = qList(c).find(x => x.id === el.dataset.id);
      c.state.ticks[t.id] = c.state.ticks[t.id] === v ? undefined : v;
      if (c.state.ticks[t.id] !== undefined) c.log.push(L(Date.now(), ST.user.name, `${v ? 'Confirmed' : 'Marked not correct'}: ${t.t}`));
      // when this document is done, move to the next one that still has questions
      if (c.state.inlineDocs && c.state.ticks[t.id] !== undefined) {
        const d = c.docs[c.state.doc];
        if (qList(c).filter(x => x.doc === d.id).every(x => c.state.ticks[x.id] !== undefined)) { const nx = c.docs.findIndex(x => qList(c).some(q => q.doc === x.id && c.state.ticks[q.id] === undefined)); if (nx >= 0) { c.state.doc = nx; c.state.zoom = null; c.state.rot = 0; } }
      }
      render(); break;
    }
    case 'goq': { const t = qList(c).find(x => x.id === el.dataset.id); c.state.step = 2; if (c.mod === 'claims') { const sb = claimSubs(c).find(x => x[2].includes(t.id)); c.state.sub = sb ? sb[0] : claimSubs(c)[0][0]; } else { if (c.mod === 'uw') c.state.sub = 'docs'; const i = c.docs.findIndex(d => d.id === t.doc); if (i >= 0) c.state.doc = i; } render(); break; }
    case 'take': { if (!c) return; c.asg = ST.user.id; c.asgAt = Date.now(); c.log.push(L(Date.now(), ST.user.name, 'Took the case from the queue')); render(); break; }
    case 'release': releaseModal(c); break;
    case 'bucket': ST.search.bucket = el.dataset.b; render(); break;
    case 'risk': ST.search.risk = !ST.search.risk; render(); break;
    case 'qinfo': ST.qinfo = ST.qinfo || {}; ST.qinfo[el.dataset.k] = !ST.qinfo[el.dataset.k]; render(); break;
    case 'gobucket': ST.search = { q: '', mod: el.dataset.m, lob: 'all', bucket: el.dataset.b, risk: false }; ST.view = 'search'; render(); break;
    case 'doc': c.state.doc = +el.dataset.i; c.state.zoom = null; c.state.rot = 0; render(); break;
    case 'view': { const i = c.docs.findIndex(d => d.id === el.dataset.doc); if (i >= 0) { c.state.doc = i; c.state.zoom = null; c.state.rot = 0; c.state.marks = true; if (!c.state.inlineDocs) c.state.drawer = 'docs'; render(); } break; }
    case 'zoom': { const z = +el.dataset.z, stg = $('#vstage'), d = c.docs[c.state.doc]; if (!z) c.state.zoom = null; else { const cur = c.state.zoom || Math.min(1.15, (stg.clientWidth - 28) / d._W); c.state.zoom = Math.max(0.4, Math.min(3, +(cur + z * 0.25).toFixed(2))); } render(); break; }
    case 'rot': c.state.rot = (c.state.rot + 90) % 360; render(); break;
    case 'full': c.state.full = !c.state.full; render(); break;
    case 'rtab': c.state.rtab = el.dataset.t; render(); break;
    case 'stage': c.state.stage = el.dataset.s; render(); break;
    case 'tick': c.state.ticks[el.dataset.id] = el.checked; if (el.checked) c.log.push(L(Date.now(), ST.user.name, `Checked: ${(c.checks.ops.find(t => t.id === el.dataset.id) || {}).t}`)); render(); break;
    case 'edit': c.state.editing = el.dataset.k; render(); setTimeout(() => { const i = $('#edv'); if (i) { i.focus(); i.select(); } }, 20); break;
    case 'edcancel': c.state.editing = null; render(); break;
    case 'edsave': { const v = Math.round(+$('#edv').value); if (!(v > 0)) { toast('Enter an amount.'); return; } const ch = c.changes.find(x => x.k === el.dataset.k); c.state.edits[ch.k] = v; c.state.editing = null; c.log.push(L(Date.now(), ST.user.name, `Changed ${ch.f} from ${inr(ch.req)} to ${inr(v)}`)); render(); break; }
    case 'fix': { const f = c.insight.fix, ch = c.changes.find(x => x.k === f.k); c.state.edits[f.k] = f.v; c.log.push(L(Date.now(), ST.user.name, `Changed ${ch.f} from ${inr(ch.req)} to ${inr(f.v)} (suggested)`)); toast(`${ch.f} set to ${inr(f.v)}.`); render(); break; }
    case 'amt': c.state.amt = +el.dataset.v; render(); break;
    case 'adj': adjModal(c, +el.dataset.i); break;
    case 'kyc': { const i = +el.dataset.i; c.state.kyc[i] = 'run'; render(); setTimeout(() => { c.state.kyc[i] = 'done'; c.log.push(L(Date.now(), ST.user.name, `Ran the KYC check again for ${c.people[i].name}: still valid`)); toast(`KYC for ${c.people[i].name} checked: still valid.`); if (ST.open === c.id) render(); }, 1200); break; }
    case 'kyclink': { const p = c.people[+el.dataset.i]; c.log.push(L(Date.now(), ST.user.name, `Sent a KYC link to ${p.name}`)); toast(`KYC link sent to ${p.name} by SMS.`); render(); break; }
    case 'remind': { const x = c; x.remind = Date.now(); if (x.ir) x.ir.reminders.push(Date.now()); toast('Reminder sent by SMS and WhatsApp.'); render(); break; }
    case 'approve': approve(c); break;
    case 'refer': refer(c); break;
    case 'ir': irModal(c); break;
    case 'reject': rejectOps(c); break;
    case 'decline': declineClaim(c); break;
    case 'deny': denyCashless(c); break;
    case 'inv': investigate(c); break;
    case 'load': loadModal(c); break;
    case 'terms': termsModal(c); break;
    case 'accept': approve(c); break;
    case 'uwdecline': uwDecline(c); break;
    case 'supapprove': supApprove(c); break;
    case 'sendback': sendBack(c); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('[data-act=marks]')) { const c = byId(ST.open); c.state.marks = el.checked; render(); }
  if (el.id === 'fmod') { ST.search.mod = el.value; render(); }
  if (el.id === 'flob') { ST.search.lob = el.value; render(); }
  if (el.id === 'amt') { const c = byId(ST.open); c.state.amt = Math.max(0, Math.round(+el.value || 0)); render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { ST.search.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { const c = ST.open && byId(ST.open); if ($('#scrim')) closeModal(); else if (c && c.state && c.state.drawer) { c.state.drawer = null; render(); } else if (ST.menu) { ST.menu = false; render(); } }
  if (e.key === 'Enter' && e.target.id === 'edv') { const b = $('[data-act=edsave]'); if (b) b.click(); }
});
function adjModal(c, i) {
  const a = assessH(c), r = a.rows[i];
  const s = modal(mh(`Deduct from ${esc(r.h)}`, `Billed ${inr(r.amt)} · payable now ${inr(r.pay)}`) + `<div class="mb"><div class="row2"><div class="fld"><label for="ja">Amount to deduct</label><input type="number" id="ja" value="${c.state.adj[i] || ''}" min="0" max="${r.amt - r.np - r.prop}"></div>
    <div class="fld"><label for="jw">Reason</label><select id="jw"><option>Not medically needed</option><option>Above the hospital's tariff</option><option>Not related to this illness</option><option>Not payable under the policy</option><option>Not supported by the records</option></select></div></div><p class="help">The customer sees each deduction with its reason and the policy clause.</p></div>` + mf('Save deduction'));
  $('[data-ok]', s).addEventListener('click', () => { const v = Math.max(0, Math.min(r.amt - r.np - r.prop, Math.round(+$('#ja', s).value || 0))); c.state.adj[i] = v; c.state.adjWhy[i] = $('#jw', s).value; c.log.push(L(Date.now(), ST.user.name, v ? `Deducted ${inr(v)} from ${r.h}: ${$('#jw', s).value}` : `Removed the deduction on ${r.h}`)); closeModal(); render(); });
}

// open the documents on the first one that still has something to confirm
function firstOpenDoc(c) { const d = c.docs[c.state.doc]; if (d && qList(c).some(q => q.doc === d.id && c.state.ticks[q.id] === undefined)) return; const i = c.docs.findIndex(x => qList(c).some(q => q.doc === x.id && c.state.ticks[q.id] === undefined)); if (i >= 0) { c.state.doc = i; c.state.zoom = null; c.state.rot = 0; } }

/* ======================= sign in, clocks, boot ======================= */
function signIn(id) {
  ST.user = userById(id); ST.avail = true; ST.view = ST.user.sup ? 'case' : 'case'; ST.open = null; ST.handled = [];
  if (ST.user.sup) { render(); return; }
  ST.booting = true; render();
  setTimeout(() => { ST.booting = false; openNext(); }, 900);
}
function afterRender() {
  const st = $('#vstage'), sh = $('.sheet[data-fit]');
  if (st && sh) { const ar = +sh.dataset.fit, w = Math.min(st.clientWidth - 28, (st.clientHeight - 28) * ar); if (w > 120) sh.style.width = Math.floor(w) + 'px'; }
}
setInterval(() => {
  if (!ST.user) return;
  $$('[data-tat]').forEach(el => { const c = byId(el.dataset.tat); if (c) el.outerHTML = tatHtml(c); });
  const n = $('[data-count]'); if (n) n.textContent = Math.max(0, Math.ceil((ST.nextAt - Date.now()) / 1000));
}, 1000);
(function boot() {
  try { const t = localStorage.getItem('nxwb-theme'); if (t) document.documentElement.dataset.theme = t; } catch (x) { }
  const h = location.hash.replace('#', '');
  const pick = { ops: 'u1', claims: 'u2', motorclaims: 'u3', uw: 'u4', motoruw: 'u5', supervisor: 'u6' }[h];
  render();
  if (pick) signIn(pick);
})();

</script>
</body>
